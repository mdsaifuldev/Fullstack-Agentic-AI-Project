

services:
  postgres:
    image: postgres:18
    container_name: ai-agentic-calendar
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai-agentic-calendar_db
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: